<div class="container">
  <h1>Submit Question</h1>
  
  @if (submitted) {
    <div class="success-box">
      <p>Question submitted for review!</p>
      <button (click)="submitted = false" class="btn-retry">Submit another</button>
    </div>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label>Question</label>
        <input type="text" formControlName="question" placeholder="Your question here..." />
      </div>

      <div class="options-grid">
        <div class="field"><label>Option 1</label><input type="text" formControlName="option1" /></div>
        <div class="field"><label>Option 2</label><input type="text" formControlName="option2" /></div>
        <div class="field"><label>Option 3</label><input type="text" formControlName="option3" /></div>
        <div class="field"><label>Option 4</label><input type="text" formControlName="option4" /></div>
      </div>

      <div class="field">
        <label>Correct Answer</label>
        <input type="text" formControlName="correctAnswer" placeholder="Must be identical to one option" />
        @if (errorMessage) {
          <span class="error-msg">{{ errorMessage }}</span>
        }
      </div>

      <div class="field">
        <label>Explanation (Optional)</label>
        <input type="text" formControlName="explanation" />
      </div>

      <button type="submit" class="submit-btn" [disabled]="form.invalid">Submit</button>
    </form>
  }
</div>
